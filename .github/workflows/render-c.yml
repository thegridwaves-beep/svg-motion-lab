name: render-c

on:
  workflow_dispatch:
    inputs:
      proj:
        description: "project folder under scenes/"
        default: "c1"
      chunks:
        description: "parallel jobs"
        default: "20"
      frames:
        description: "total frames"
        default: "1820"
      name:
        description: "output name"
        default: "clips"
      conc:
        description: "renderer concurrency per job"
        default: "2"
      ranges:
        description: "optional frame ranges a-b,c-d (inclusive); empty = 0..frames-1"
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - id: p
        run: |
          N=${{ github.event.inputs.chunks }}
          echo "matrix={\"chunk\":[$(seq -s, 0 $((N-1)))]}" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: scenes/${{ github.event.inputs.proj }}
        run: npm install --no-audit --no-fund --loglevel=error
      - name: Render
        working-directory: scenes/${{ github.event.inputs.proj }}
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          set -e
          mkdir -p /tmp/out
          python3 - > runs.txt <<'PY'
          n=${{ github.event.inputs.chunks }}; i=${{ matrix.chunk }}; F=${{ github.event.inputs.frames }}; R="${{ github.event.inputs.ranges }}".strip()
          fr=[]
          if R:
              for p in R.split(","):
                  a,b=map(int,p.split("-")); fr+=list(range(a,b+1))
          else: fr=list(range(F))
          L=len(fr); mine=fr[L*i//n:L*(i+1)//n]
          runs=[]
          for f in mine:
              if runs and f==runs[-1][1]+1: runs[-1][1]=f
              else: runs.append([f,f])
          for a,b in runs: print(a,b)
          PY
          cat runs.txt
          while read A B; do
            O=/tmp/out/seg$(printf %05d $A).mp4
            node scripts/render.mjs $O $A $B ${{ github.event.inputs.conc }} || node scripts/render.mjs $O $A $B 1
          done < runs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.chunk }}
          path: /tmp/out/*.mp4
          retention-days: 1

  pack:
    needs: render
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true
          path: clips
      - name: Encrypt and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p out
          echo "::notice title=clips::$(ls clips | wc -l) clips"
          tar -cf c.tar -C clips .
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in c.tar -out out/${{ github.event.inputs.name }}.bin -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey render/pub.pem -in k.txt -out out/${{ github.event.inputs.name }}.key
          rm -f k.txt c.tar
          gh release create "c-${{ github.run_number }}" out/* -R "${{ github.repository }}" --title "c-${{ github.run_number }}" --notes "run ${{ github.run_id }}"
      - name: Remove raw parts
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].id'); do gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"; done
